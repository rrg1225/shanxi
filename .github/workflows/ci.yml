name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-ui/package-lock.json
      - run: python scripts/project_health.py
      - run: python scripts/ops_check.py
      - run: python scripts/mock_inventory.py
      - run: npm ci
        working-directory: frontend-ui
      - run: npm run health
        working-directory: frontend-ui
      - run: npm run build
        working-directory: frontend-ui
